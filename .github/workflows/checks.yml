name: Workspace checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run check
